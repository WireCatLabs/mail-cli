name: Monthly validation

on:
  schedule:
    - cron: "41 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@09918a54ac2030fa12b0fbcb8aa179d6ef2404d5 # v0.93.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
