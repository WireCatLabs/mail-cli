name: Monthly validation

on:
  schedule:
    - cron: "41 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@0e62c4e3077058cbec0d94dc8fa82a1fabc2b0e3 # v0.72.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
