# Secret scanning. The default rules catch the well-known shapes (AWS, GitHub, Stripe, private
# keys); the rule below catches the one secret only this project handles.
#
#   gitleaks git --redact .              the whole history
#   gitleaks git --staged --redact .     what is about to be committed — the pre-commit hook
#
# `--redact` matters: without it a finding prints the secret it found into your terminal and your
# CI log, which is a second leak on top of the first.

[extend]
useDefault = true

[[rules]]
id = "mail-app-password"
description = "IMAP app password — reads the whole mailbox it was made for"
# Providers print app passwords as 16 or more letters, some in groups of four (abcd efgh ijkl mnop)
# or with dashes. Matched near its key name rather than by shape alone, because 16 plain letters
# are also an ordinary word run in prose and fixtures.
regex = '''(?i)(?:app[_ -]?password|MAIL_PASSWORD|imap[_-]?pass(?:word)?)["'\s:=]{1,10}([A-Za-z0-9]{4}(?:[ -]?[A-Za-z0-9]{4}){3,})'''
secretGroup = 1
tags = ["mail", "password"]

[allowlist]
description = "Synthetic values used by tests and documentation"
regexTarget = "match"
regexes = [
  '''fixture-app-password-[A-Za-z0-9]+''',
]
paths = ['''pnpm-lock\.yaml''']
